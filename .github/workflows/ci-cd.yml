name: CI / CD

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

# Cancel any in-progress run for the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Job 2: Unit & AI tests ─────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      # Dummy values — tests mock Prisma and auth, no real DB needed
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      BETTER_AUTH_SECRET: ci-test-secret-minimum-32-characters-ok
      BETTER_AUTH_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-placeholder
      OLLAMA_BASE: http://localhost:11434
      OLLAMA_MODEL: llama3.1:8b
      GOOGLE_AI_API_KEY: placeholder
      GOOGLE_AI_MODEL: gemini-2.5-flash
      RESEND_API_KEY: re_placeholder
      GOOGLE_CLIENT_ID: placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: placeholder
      NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:placeholder
      FIREBASE_PROJECT_ID: placeholder
      FIREBASE_CLIENT_EMAIL: placeholder@placeholder.iam.gserviceaccount.com
      FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIplaceholder\n-----END PRIVATE KEY-----\n"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test -- --ci --forceExit --passWithNoTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  # ── Job 3: Docker build validation ─────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validate only on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wads-final:${{ github.sha }}
          # Layer cache speeds up repeat builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Deploy (self-hosted runner on the server) ──────────────────────
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [lint, docker-build]
    if: github.ref == 'refs/heads/Main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        shell: bash
        run: |
            set -e

            echo "──────────────────────────────────────────"
            echo "  Deployment started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Commit: ${{ github.sha }}"
            echo "  Actor : ${{ github.actor }}"
            echo "──────────────────────────────────────────"

            cd ${{ secrets.DEPLOY_PATH }}

            echo "[1/4] Pulling latest code..."
            git pull origin Main

            echo "[2/4] Stopping existing containers..."
            docker compose down

            echo "[3/4] Building and starting containers..."
            docker compose up --build -d

            echo "[4/4] Deployment log (last 60 lines)..."
            sleep 10
            docker compose logs --tail=60 web

            echo "──────────────────────────────────────────"
            echo "  Container status:"
            docker compose ps
            echo "──────────────────────────────────────────"

      - name: Health check — wait for app to be ready
        run: |
          echo "Waiting 40 s for the app to start..."
          sleep 40

          echo "Running health check against http://localhost:3014/api/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "http://localhost:3014/api/health" || true)
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 15
          done

          echo "Health check failed after 5 attempts."
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed. Check the SSH deploy step and health check logs above."
