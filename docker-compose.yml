services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://e2526-wads-b4ac-05.csbihub.id
    network_mode: host
    env_file: .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3014/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
